name: simulation

# Phase 0c runs in CI without hardware, by construction: the harness is
# stdlib-only and time is virtual, so the whole suite is deterministic and
# faster than real time (implementation plan §3.3).
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  suite:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Build the C player (LVGL + ThorVG, no cmake, no SDL)
        run: |
          poc/host-player/fetch-lvgl.sh
          poc/host-player/fetch-cjson.sh
          make -C poc/host-player -j$(nproc) lib
      - name: Fetch the Hershey stroke fonts
        # The composer compiles handwriting from these; without them the guide
        # and handwriting tests skip rather than fail, which is worse than
        # either — a skipped test looks like a passing one in a summary.
        run: tools/fetch-hershey.sh
      - name: Run the test suite
        run: python -m pytest -q
      - name: Run every scenario
        run: python -m sim.scenarios all
      - name: Render the video wall and a capture sequence
        run: |
          python -m sim.wall --mixed --at 3800 --out sim-out/wall-mixed.png
          python -m sim.wall --scenario late_join --out sim-out/wall-late-join.png
          python -m sim.capture --scenario basic_play --times 0,1050,2100,3150,4200 --out sim-out
      - name: Keep the frames
        uses: actions/upload-artifact@v4
        with:
          name: sim-frames-py${{ matrix.python-version }}
          path: sim-out/
